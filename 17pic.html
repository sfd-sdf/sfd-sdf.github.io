<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <style>
        html, body {
            margin: 0;
            height: 100vh;
            width: 100vw;
            background-color: white;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            position: relative;
            user-select: none;
            font-family: Arial, sans-serif;
        }
        .cell {
            position: relative;
            cursor: pointer;
            border: 1px solid #ddd;
            box-sizing: border-box;
        }
        .image {
            position: absolute;
            width: 40px;
            height: 40px;
            object-fit: cover;
            transition: opacity 0.3s;
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #f0f0f0;
            transform: translate(-50%, -50%);
        }
        /* 中央独立图片样式 */
        #centerImage {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.3s;
            opacity: 1;
            pointer-events: auto;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 3px;
        }
        /* 隐藏状态 */
        #centerImage.hidden {
            opacity: 0;
            pointer-events: auto;
        }
    </style>
</head>
<body>
<script>
    const gridSize = 5; // 5x5网格

    // 图片URL数组（16张图片对应4x4内部交叉点）- 更换了第7张图片
    const imageUrls = [
        "https://images.unsplash.com/photo-1541963463532-d68292c34b19?w=100&h=100&fit=crop", // 1
        "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop", // 2
        "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop", // 3
        "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100&h=100&fit=crop", // 4
        "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop", // 5
        "https://images.unsplash.com/photo-1519764622345-23439dd774f7?w=100&h=100&fit=crop", // 6
        "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=face", // 7 - 更换为清晰图片
        "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=100&h=100&fit=crop", // 8
        "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop", // 9
        "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&h=100&fit=crop", // 10
        "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop", // 11
        "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?w=100&h=100&fit=crop", // 12
        "https://images.unsplash.com/photo-1531427186611-ecfd6d936c79?w=100&h=100&fit=crop", // 13
        "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100&h=100&fit=crop", // 14
        "https://images.unsplash.com/photo-1544725176-7c40e5a71c5e?w=100&h=100&fit=crop", // 15
        "https://images.unsplash.com/photo-1519345182560-3f2917c472ef?w=100&h=100&fit=crop"  // 16
    ];

    // 生成25个网格区域
    for(let row = 0; row < gridSize; row++) {
        for(let col = 0; col < gridSize; col++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = row;
            cell.dataset.col = col;
            document.body.appendChild(cell);
        }
    }

    // 只在内部交叉点上放置图片（4x4=16个点）
    let imageIndex = 0;
    for(let row = 1; row < gridSize; row++) {
        for(let col = 1; col < gridSize; col++) {
            if (imageIndex < imageUrls.length) {
                const image = document.createElement('img');
                image.className = 'image';
                image.src = imageUrls[imageIndex];
                image.alt = `图片 ${imageIndex + 1}`;
                image.id = `image-${row}-${col}`;

                // 计算交叉点位置（相对于视口的百分比）
                const leftPercent = (col / gridSize) * 100;
                const topPercent = (row / gridSize) * 100;

                image.style.left = `${leftPercent}%`;
                image.style.top = `${topPercent}%`;

                document.body.appendChild(image);

                // 为每个交叉点图片添加点击事件
                image.addEventListener('click', () => {
                    if(image.style.display === 'none') {
                        image.style.display = 'block';
                    } else {
                        image.style.display = 'none';
                    }
                });

                imageIndex++;
            }
        }
    }

    // 创建屏幕中央独立图片
    const centerImage = document.createElement('img');
    centerImage.id = 'centerImage';
    centerImage.src = "https://images.unsplash.com/photo-1561037404-61cd46aa615b?w=100&h=100&fit=crop";
    centerImage.alt = "中央图片";
    document.body.appendChild(centerImage);

    // 点击中央图片切换显示隐藏，使用class控制opacity
    centerImage.addEventListener('click', () => {
        centerImage.classList.toggle('hidden');
    });
</script>
</body>
</html>
