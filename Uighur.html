        body {

        }

</head>
<body>
    <select name="example" id="example">
        <option value="">خىزاق بىلەن بىر خىزاق بىلەن</option>
        <option value="option1">بۇ بىر تۇرىڭلىق تېكىست بولىدۇ، بۇ تۇرىڭلىق تېكىست بولىدۇبۇ بىر تۇرىڭلىق تېكىست بولىدۇ، بۇ تۇرىڭلىق تېكىست بولىد</option>
        <option value="option2">بۇ بىرىكىن تۇرىڭلىق تېكىست بولىدۇ، بۇ بىرىكىن تۇرىڭلىق تېكىست بولىدۇ رىڭلىق تېكىست بولىدۇ، بۇ بىرىكىن تۇرىڭلىق تېكىست بولىدۇ</option>
        <option value="option3">تۇرىڭلىق تېكىست</option>
    </select>
</body>
</html>
