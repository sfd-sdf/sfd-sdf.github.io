<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯白色背景</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FFFFFF; /* 纯白色背景 */
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* 添加一个几乎不可见的边框，仅用于确认页面存在 */
        body:after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(0, 0, 0, 0.01);
            pointer-events: none;
        }
    </style>
</head>
<body>
<!-- 这是一个完全空白的页面 -->
</body>
</html>
