<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多媒体元素叠加展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            font-size: 1.3rem;
            font-weight: 600;
        }

        .card-content {
            padding: 20px;
            position: relative;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .media-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        video, audio {
            width: 100%;
            border-radius: 8px;
        }

        .overlay {
            position: absolute;
            border-radius: 8px;
        }

        .text-overlay {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        canvas {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .canvas-overlay {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            background: rgba(255, 0, 0, 0.6);
        }

        .img-over-img {
            top: 10px;
            right: 10px;
            width: 40%;
        }

        .text-on-img {
            bottom: 20px;
            left: 20px;
        }

        .canvas-on-video {
            top: 10px;
            left: 10px;
        }

        .canvas-on-audio {
            top: 10px;
            left: 10px;
        }

        .img-on-video {
            top: 10px;
            right: 10px;
            width: 30%;
        }

        .img-on-audio {
            top: 10px;
            right: 10px;
            width: 30%;
        }

        .canvas-on-img {
            top: 10px;
            left: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>多媒体元素叠加效果展示</h1>
        <p class="subtitle">本页面展示了各种HTML5多媒体元素的叠加效果，包括图片、文字、视频、音频和Canvas元素的组合</p>
    </header>

    <div class="grid">
        <!-- 图片与图片叠加 -->
        <div class="card">
            <div class="card-header">图片与图片叠加</div>
            <div class="card-content">
                <div class="media-container">
                    <img src="jpg.jpg" alt="背景图片">
                    <img src="png.png" alt="叠加图片" class="overlay img-over-img">
                </div>
            </div>
        </div>

        <!-- 图片与文字叠加 -->
        <div class="card">
            <div class="card-header">图片与文字叠加</div>
            <div class="card-content">
                <div class="media-container">
                    <img src="png.png" alt="城市图片">
                    <div class="overlay text-overlay text-on-img">美丽的城市夜景</div>
                </div>
            </div>
        </div>

        <!-- 视频与Canvas叠加 -->
        <div class="card">
            <div class="card-header">视频与Canvas叠加（Canvas在视频左上角）</div>
            <div class="card-content">
                <div class="media-container">
                    <video controls>
                        <source src="movie.mp4" type="video/mp4">
                        您的浏览器不支持HTML5视频
                    </video>
                    <canvas width="80" height="80" class="overlay canvas-on-video"></canvas>
                </div>
            </div>
        </div>

        <!-- 音频与Canvas叠加 -->
        <div class="card">
            <div class="card-header">音频与Canvas叠加（Canvas在音频左上角）</div>
            <div class="card-content">
                <div class="media-container">
                    <audio controls>
                        <source src="audio.mp3" type="audio/mp3">
                        您的浏览器不支持HTML5音频
                    </audio>
                    <div class="overlay canvas-on-audio canvas-overlay">音频波形</div>
                </div>
            </div>
        </div>

        <!-- 视频和图片叠加 -->
        <div class="card">
            <div class="card-header">视频和图片叠加</div>
            <div class="card-content">
                <div class="media-container">
                    <video controls>
                        <source src="movie.mp4" type="video/mp4">
                        您的浏览器不支持HTML5视频
                    </video>
                    <img src="png.png" alt="叠加图片" class="overlay img-on-video">
                </div>
            </div>
        </div>

        <!-- 音频和图片叠加 -->
        <div class="card">
            <div class="card-header">音频和图片叠加</div>
            <div class="card-content">
                <div class="media-container">
                    <audio controls>
                        <source src="audio.mp3" type="audio/mp3">
                        您的浏览器不支持HTML5音频
                    </audio>
                    <img src="png.png" alt="音乐图片" class="overlay img-on-audio">
                </div>
            </div>
        </div>

        <!-- Canvas和图片叠加 -->
        <div class="card">
            <div class="card-header">Canvas和图片叠加</div>
            <div class="card-content">
                <div class="media-container">
                    <img src="png.png" alt="科技图片">
                    <canvas width="100" height="100" class="overlay canvas-on-img"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>HTML5多媒体元素叠加效果演示 - 使用CSS绝对定位实现</p>
    </footer>
</div>

<script>
    // 为Canvas元素添加一些简单的绘制
    document.addEventListener('DOMContentLoaded', function() {
        const canvases = document.querySelectorAll('canvas');

        canvases.forEach(canvas => {
            const ctx = canvas.getContext('2d');

            // 绘制不同的图形
            if(canvas.parentElement.querySelector('video')) {
                // 视频上的Canvas
                ctx.fillStyle = 'rgba(255, 50, 50, 0.7)';
                ctx.fillRect(10, 10, 60, 60);
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.fillText('播放中', 15, 40);
            } else if(canvas.parentElement.querySelector('img')) {
                // 图片上的Canvas
                ctx.fillStyle = 'rgba(50, 150, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(50, 50, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.fillText('Canvas', 25, 50);
            }
        });
    });
</script>
</body>
</html>
