<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内嵌PDF示例</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .pdf-container {
            width: 100%;
            height: 800px; /* 根据需要调整高度 */
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>内嵌PDF文件</h1>
    <p>以下是一个嵌入的PDF文件示例：</p>
    <div class="pdf-container">
        <embed src="https://www.yylq.gov.cn/uploadfiles/202403/2024030109554171250.pdf" type="application/pdf" width="100%" height="100%" />
    </div>
    <p>如果PDF无法加载，请检查网络连接或稍后重试。</p>
</body>
</html>
