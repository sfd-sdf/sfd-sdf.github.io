<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Select with Color Change</title>
    <style>
        select {
            width: 300px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }

        .option-animation {
            opacity: 0;
            background-color: #fff; /* 初始背景颜色 */
            transition: opacity 0.5s ease, background-color 0.5s ease;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 10px;
        }

        .option-animation.active {
            opacity: 1;
            background-color: #f0f8ff; /* 选中后的背景颜色 */
        }
    </style>
</head>
<body>
    <h2>Animated Select with Color Change</h2>
    <label for="example">Choose an option:</label>
    <select name="example" id="example">
        <option value="option1">这是一个非常长的选项文本，可能会占据多行；这是一个非常长的选项文本，可能会占据多行</option>
        <option value="option2">这是另一个较长的选项文本，同样可能会占据多行；这是另一个较长的选项文本，同样可能会占据多行</option>
        <option value="option3">短选项</option>
        <option value="option4">这是第四个选项，内容稍微长一些</option>
        <option value="option5">第五个选项</option>
    </select>

    <div id="selectedOption" class="option-animation">
        <!-- 动画效果将在这里显示 -->
    </div>

    <script>
        const selectElement = document.getElementById('example');
        const selectedOptionElement = document.getElementById('selectedOption');

        selectElement.addEventListener('change', () => {
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            selectedOptionElement.textContent = selectedOption.textContent;
            selectedOptionElement.classList.add('active');

            // 移除动画类，以便下次选择时重新触发动画
            setTimeout(() => {
                selectedOptionElement.classList.remove('active');
            }, 500); // 动画持续时间为0.5秒
        });
    </script>
</body>
</html>
