<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select with Form Attribute</title>
</head>
<body>
    <form id="myForm" action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        
        <button type="submit">Submit</button>
    </form>
    
    <select form="myForm" name="example">
        <option value="option1">这是一个非常长的选项文本，可能会占据多行</option>
        <option value="option2">这是另一个较长的选项文本，同样可能会占据多行</option>
        <option value="option3">短选项</option>
    </select>
</body>
</html>
